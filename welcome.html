<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приглашение</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Cormorant+Garamond:wght@400&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: radial-gradient(circle at top, #1b1214, #0e0e0e);
            color: #eaeaea;
            font-family: 'Cormorant Garamond', serif;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .card {
            animation: fadeUp 1.2s ease forwards;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            margin-bottom: 20px;
        }

        p {
            font-style: italic;
            margin-bottom: 40px;
            opacity: 0.85;
        }

        button {
            background: none;
            border: 1px solid #7a1e2d;
            color: #7a1e2d;
            padding: 18px 40px;
            font-size: 14px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #7a1e2d;
            color: #0e0e0e;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Иван — да — Марья</h1>
    <p>Мы хотим разделить этот день с вами</p>
    <button id="enter">Открыть приглашение</button>
</div>

<script>
document.getElementById('enter').addEventListener('click', () => {
    sessionStorage.setItem('playMusic', 'yes');
    window.location.href = 'index.html';
});
</script>

</body>
</html>
